# Trimmed-down devstats-helm values.yaml for the splitcrons compatibility tests.
# Everything that is not part of the tool's devstatsValues struct is dropped on output
# (that is what the Go program does), so the unrelated keys below must vanish.
namespace: devstats-prod
imagePullPolicy: Always
pvSize: 10Gi
usePV: 1
affiliationsImportCron: '10 2 * * *'
